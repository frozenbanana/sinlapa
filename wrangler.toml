name = "sinlapa"
pages_build_output_dir = "public"
compatibility_date = "2026-07-31"

# Create a KV namespace in the Cloudflare dashboard, then replace these IDs.
# Local `npm run dev` still works with local simulation.
[[kv_namespaces]]
binding = "SITE_CONFIG"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

# Create an R2 bucket (e.g. sinlapa-media) and bind it in the Pages dashboard too.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sinlapa-media"
preview_bucket_name = "sinlapa-media-preview"
