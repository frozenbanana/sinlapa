name = "sinlapa"
pages_build_output_dir = "public"
compatibility_date = "2026-07-31"

# Create a KV namespace in the Cloudflare dashboard, then replace these IDs.
# Local `npm run dev` still works with the --kv flag / preview binding.
[[kv_namespaces]]
binding = "SITE_CONFIG"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"
